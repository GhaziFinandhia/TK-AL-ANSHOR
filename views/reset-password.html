<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - RA Al-Anshor</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f7c5e, #d9f3e8);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .box {
        width: 100%;
        max-width: 420px;
        background: #fff;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;
        color: #0f7c5e;
        margin-bottom: 10px;
      }

      .desc {
        text-align: center;
        color: #555;
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
        margin-bottom: 18px;
        font-size: 14px;
      }

      input:focus {
        border-color: #0f7c5e;
      }

      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #0f7c5e;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
      }

      button:hover {
        background: #0b6049;
      }

      #message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
      }

      .back {
        margin-top: 20px;
        text-align: center;
      }

      .back a {
        color: #0f7c5e;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }

      .back a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Reset Password</h2>
      <p class="desc">Masukkan password baru untuk akun PPDB TK Al Anshor.</p>

      <form id="resetForm">
        <label for="password">Password Baru</label>
        <input
          type="password"
          id="password"
          placeholder="Masukkan password baru"
          required
        />

        <label for="confirmPassword">Konfirmasi Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Ulangi password baru"
          required
        />

        <button type="submit">Ubah Password</button>

        <p id="message"></p>

        <div class="back">
          <a href="/login">Kembali ke Login</a>
        </div>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");

      const form = document.getElementById("resetForm");
      const message = document.getElementById("message");

      if (!token) {
        message.innerText = "Token reset password tidak ditemukan.";
        message.style.color = "red";
        form.querySelector("button").disabled = true;
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password.length < 6) {
          message.innerText = "Password minimal 6 karakter.";
          message.style.color = "red";
          return;
        }

        if (password !== confirmPassword) {
          message.innerText = "Password dan konfirmasi password tidak sama.";
          message.style.color = "red";
          return;
        }

        message.innerText = "Sedang mengubah password...";
        message.style.color = "#333";

        try {
          const response = await fetch("/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              token,
              password,
            }),
          });

          const data = await response.json();

          if (data.success) {
            message.innerText = data.message;
            message.style.color = "green";

            setTimeout(() => {
              window.location.href = "/login";
            }, 2000);
          } else {
            message.innerText = data.message;
            message.style.color = "red";
          }
        } catch (error) {
          message.innerText = "Terjadi kesalahan. Coba lagi nanti.";
          message.style.color = "red";
        }
      });
    </script>
  </body>
</html>
