<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Password - RA Al-Anshor</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f7c5e, #d9f3e8);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .box {
        width: 100%;
        max-width: 420px;
        background: #fff;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;
        color: #0f7c5e;
        margin-bottom: 10px;
      }

      .desc {
        text-align: center;
        color: #555;
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: bold;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
        margin-bottom: 18px;
        font-size: 14px;
      }

      input:focus {
        border-color: #0f7c5e;
      }

      button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: #0f7c5e;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
      }

      button:hover {
        background: #0b6049;
      }

      #message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        line-height: 1.5;
      }

      .back {
        margin-top: 20px;
        text-align: center;
      }

      .back a {
        color: #0f7c5e;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
      }

      .back a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Lupa Password</h2>
      <p class="desc">
        Masukkan email yang terdaftar di akun PPDB TK Al Anshor. Link reset
        password akan dikirim ke email tersebut.
      </p>

      <form id="forgotForm">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Masukkan email akun"
          required
        />

        <button type="submit">Kirim Link Reset</button>

        <p id="message"></p>

        <div class="back">
          <a href="/login">Kembali ke Login</a>
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById("forgotForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;

        message.innerText = "Sedang mengirim link reset...";
        message.style.color = "#333";

        try {
          const response = await fetch("/forgot-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          if (data.success) {
            message.innerText = data.message;
            message.style.color = "green";
          } else {
            message.innerText = data.message;
            message.style.color = "red";
          }
        } catch (error) {
          message.innerText = "Terjadi kesalahan. Coba lagi nanti.";
          message.style.color = "red";
        }
      });
    </script>
  </body>
</html>
